[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insighta-slidegen-py"
version = "0.1.0"
description = "Google Slides + true-vector PDF compositor for insighta-slidegen"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "reportlab>=4.0",
    "pydantic>=2.0",
    # chart_regen (matplotlib) + diagram_regen (Graphviz, roadmap 2). The
    # `graphviz` lib shells out to the `dot` binary — CI installs graphviz via
    # apt; the renderer degrades to label-only when dot is absent.
    "matplotlib>=3.8",
    "graphviz>=0.20",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored insighta-visual-deck tools (ADR 0003 D7) — byte-stable copies of
# deck/scripts/*.py; do not lint or "fix" vendored code.
extend-exclude = [
    "deck_tools/figures.py",
    "deck_tools/validate_deck.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Make the slides_build package importable without `pip install -e .`
# (rootdir is py/, so "." adds py/ to sys.path).
pythonpath = ["."]
