# Prod deploy target TBD — slidegen v1 is an offline CLI/pipeline; this builds+publishes
# the CV service image. No EC2 prod server yet.
#
# Triggers:
#   - workflow_dispatch (manual, gated) with a required reason field
#   - version tags (v*.*.*) pushed to main for automated release builds
#
# What it does:
#   1. Runs the full CI suite via workflow_call
#   2. Builds the TypeScript orchestrator (dist/)
#   3. Builds + pushes the Mac Mini CV service Docker image to GHCR
#      (Dockerfile: mac-mini/slidegen-service/Dockerfile)
#
# Required repo secrets (set in repo Settings > Secrets):
#   GHCR_TOKEN  — GitHub PAT with packages:write (or use GITHUB_TOKEN with packages write)
#
# No EC2 SSH keys, no SG IDs, no Tailscale IPs — this workflow is public-safe.

name: Deploy

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Deploy (manual: {0})', inputs.reason || 'no reason given')
      || format('Deploy {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually? (shown in run-name)'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

# Never cancel an in-flight deploy — let it finish or fail cleanly.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image name is lowercase repo owner/name — adjust if org differs.
  CV_SERVICE_IMAGE: ghcr.io/${{ github.repository_owner }}/insighta-slidegen-cv

jobs:
  # ── Gate: run full CI before any build/publish ───────────────────────────────
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  # ── Build TypeScript dist/ ───────────────────────────────────────────────────
  build-ts:
    name: Build TypeScript
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: tsc build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Build + push Mac Mini CV service image to GHCR ──────────────────────────
  build-cv-image:
    name: Build & Push CV Service Image
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN automatically has packages:write when the job has
          # `permissions: packages: write` above. No extra secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag with both the commit SHA (immutable, for rollback) and `latest`.
      - name: Build & push CV service image
        uses: docker/build-push-action@v5
        with:
          context: mac-mini/slidegen-service
          file: mac-mini/slidegen-service/Dockerfile
          push: true
          tags: |
            ${{ env.CV_SERVICE_IMAGE }}:latest
            ${{ env.CV_SERVICE_IMAGE }}:${{ github.sha }}
          # Layer cache stored in GitHub Actions cache (free, per-repo).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: |
          echo "CV service image pushed:"
          echo "  ${{ env.CV_SERVICE_IMAGE }}:${{ github.sha }}"
          echo "  ${{ env.CV_SERVICE_IMAGE }}:latest"
