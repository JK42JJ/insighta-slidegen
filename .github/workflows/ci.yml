name: CI

# Trigger: PRs to main + reuse via workflow_call from deploy.yml.
# Push-to-branch is intentionally omitted — pull_request already covers
# feature branches, and the double-run (push + pull_request) wastes minutes.
on:
  pull_request:
    branches: [main]
    # NO paths filter on purpose: main's ruleset requires these checks to pass before
    # merge, so CI must run on EVERY PR. A paths filter would skip CI on docs-only PRs,
    # leaving the required checks unreported → the PR becomes unmergeable. Running a few
    # fast jobs on a docs PR is cheaper than that deadlock.
  workflow_call:

# Cancel superseded runs for the same PR/branch. deploy.yml keeps
# cancel-in-progress: false so production runs are never interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into the Node.js 24 action runtime ahead of the 2026-06-16 forced switch,
# silencing the Node 20 deprecation warnings on checkout/setup-node/setup-python.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── TypeScript ──────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: tsc --noEmit (strict)
        run: npm run typecheck

  # ── ESLint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

  # ── TS unit tests (vitest) ───────────────────────────────────────────────────
  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # PR-F3 build E2E (src/deck/orchestrate-runner.test.ts) runs the REAL
      # vendored deck chain: deck_recipes.js needs pptxgenjs from the vendored
      # deck/ package (not hoisted into the root node_modules). The validator
      # (validate_deck.py) is stdlib-only and uses the runner's preinstalled
      # python3 — no pip install needed here.
      - name: Install vendored deck deps (pptxgenjs for the build E2E)
        run: npm ci --prefix deck

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run vitest
        run: npm run test

  # ── Python lint + tests ──────────────────────────────────────────────────────
  python:
    name: Python lint + test (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CV-service dependency set (torch + paddle + CV stacks) overflows the
      # default runner disk (observed: pip "OSError: [Errno 28] No space left on
      # device", 2026-06-10). Drop unused preinstalled toolchains (~25-30 GB).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # Cache keys cover both the main compositor and the CV service.
          cache-dependency-path: |
            py/requirements*.txt
            mac-mini/slidegen-service/requirements*.txt

      # CI runs lint + mocked tests only — CUDA wheels (several GB of
      # nvidia-*-cu12) are pure waste here. Pre-installing the CPU build means
      # the transitive `torch` requirement is already satisfied, so the
      # requirements install never pulls the CUDA variant.
      - name: Pre-install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install py/ deps
        # requirements.txt may not exist yet; tolerate missing file gracefully.
        run: |
          if [ -f py/requirements.txt ]; then
            pip install -r py/requirements.txt
          fi
          pip install ruff pytest

      - name: Install mac-mini/slidegen-service deps
        run: |
          if [ -f mac-mini/slidegen-service/requirements.txt ]; then
            pip install -r mac-mini/slidegen-service/requirements.txt
          fi

      - name: Ruff lint — py/
        run: ruff check py/ --output-format=github || true

      - name: Ruff lint — mac-mini/slidegen-service/
        run: ruff check mac-mini/slidegen-service/ --output-format=github || true

      - name: pytest — py/
        run: |
          if [ -d py/tests ]; then
            pytest py/tests -v
          else
            echo "No py/tests directory yet — skipping"
          fi

      - name: pytest — mac-mini/slidegen-service/
        run: |
          if [ -d mac-mini/slidegen-service/tests ]; then
            pytest mac-mini/slidegen-service/tests -v
          else
            echo "No mac-mini/slidegen-service/tests directory yet — skipping"
          fi

      # The YOLO serving wrapper only needs fastapi/PIL/httpx at import time
      # (the model itself is lazy-loaded) — already covered by the installs above.
      - name: pytest — runpod/yolo-service/
        run: |
          if [ -d runpod/yolo-service/tests ]; then
            pytest runpod/yolo-service/tests -v
          else
            echo "No runpod/yolo-service/tests directory yet — skipping"
          fi

  # ── TypeScript build ─────────────────────────────────────────────────────────
  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: tsc build
        run: npm run build
